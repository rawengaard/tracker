<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vanelogg</title>
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vanelogg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{
  --c1:#0f766e;--c2:#2563eb;--c3:#9333ea;--c4:#db2777;--c5:#b45309;--c6:#4d7c0f;
  --bg:#f4f6f4;--card:#fff;--ink:#17201e;--muted:#5b6865;--line:#dde3e0;
  --hab:#0f766e;--hab-soft:#d6efeb;--bad:#b45309;--bad-soft:#fbe9d0;--danger:#b42318;
  --focus:#1d4ed8;
}
@media (prefers-color-scheme:dark){
  :root{--c1:#2dd4bf;--c2:#60a5fa;--c3:#c084fc;--c4:#f472b6;--c5:#fbbf24;--c6:#a3e635;--bg:#0f1514;--card:#182120;--ink:#e8efed;--muted:#9bacA8;--line:#2b3836;
    --hab:#2dd4bf;--hab-soft:#12403b;--bad:#fbbf24;--bad-soft:#473512;--danger:#f97066;--focus:#8ab4ff}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 16px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1{font-size:1.35rem;margin:0}
h2{font-size:1.05rem;margin:0}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.iconbtn:disabled{opacity:.35;cursor:default}
.datehead{flex:1;text-align:center}
.datehead .d{font-weight:650;font-size:1.1rem}
.datehead .s{font-size:.85rem;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--hab);font-weight:600;padding:6px 4px;min-height:36px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:12px}
.card h2{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.badge{font-size:.8rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--hab-soft);color:var(--hab)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
h2+.row,.ghead+.row{border-top:0}
.row .info{flex:1;min-width:0}
.row .name{font-weight:600;overflow-wrap:anywhere;line-height:1.25}
.row .sub{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:2px 8px;flex-wrap:wrap;line-height:1.3}
.row.done .sub{color:var(--g,var(--hab));font-weight:600}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:1.4rem;line-height:1}
.gc-teal{--g:#0f766e;--gs:#d6efeb;--gt:#fff}
.gc-blue{--g:#1d4ed8;--gs:#dbe7fd;--gt:#fff}
.gc-purple{--g:#6d28d9;--gs:#e9defc;--gt:#fff}
.gc-pink{--g:#be185d;--gs:#fbdcea;--gt:#fff}
.gc-orange{--g:#b43c0a;--gs:#fde3d3;--gt:#fff}
.gc-green{--g:#166534;--gs:#d8f1de;--gt:#fff}
.gc-red{--g:#b91c1c;--gs:#fbdada;--gt:#fff}
.gc-slate{--g:#475569;--gs:#e2e8f0;--gt:#fff}
@media (prefers-color-scheme:dark){
.gc-teal{--g:#2dd4bf;--gs:#12403b;--gt:#062b27}
.gc-blue{--g:#8ab4ff;--gs:#1b2a4d;--gt:#0b1530}
.gc-purple{--g:#b79cff;--gs:#2c2150;--gt:#150b33}
.gc-pink{--g:#f472b6;--gs:#4a1c37;--gt:#2e0a1c}
.gc-orange{--g:#fb923c;--gs:#4a2a12;--gt:#2b1200}
.gc-green{--g:#4ade80;--gs:#143a21;--gt:#04210f}
.gc-red{--g:#f87171;--gs:#4a1c1c;--gt:#2e0808}
.gc-slate{--g:#a8b5c6;--gs:#2a3340;--gt:#10161d}}
.stepper button.plus{background:var(--g,var(--hab));border-color:var(--g,var(--hab));color:var(--gt,#fff)}
.row.badrow .stepper button.plus{background:var(--g,var(--bad));border-color:var(--g,var(--bad));color:var(--gt,#fff)}
@media (prefers-color-scheme:dark){.stepper button.plus{color:var(--gt,#062b27)}.row.badrow .stepper button.plus{color:var(--gt,#2b1b00)}}
.card.gcard{border-left:6px solid var(--g)}
.gh{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.gh .nm{font-weight:700;flex:1;overflow-wrap:anywhere}
.ic{width:30px;height:30px;border-radius:10px;background:var(--gs);color:var(--g);display:grid;place-items:center;flex:none}
.gcnt{font-size:.8rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--gs,var(--hab-soft));color:var(--g,var(--hab))}
.sect{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 8px}
.sect:first-of-type{margin-top:8px}
.sect h2{font-size:1.1rem}
.card>.row:first-child,.gh+.row{border-top:0}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;background:var(--g);color:var(--gt,#fff);display:grid;place-items:center;padding:0}
.sw[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.stepper button.plus.secondary{background:var(--bg);border-color:var(--line);color:var(--ink)}
.row.done .stepper button.plus.secondary{border-color:var(--g,var(--hab))}
.stepper button:disabled{opacity:.35}
.cnt{min-width:40px;height:44px;text-align:center;font-size:1.2rem;font-weight:700;border:1px solid transparent;border-radius:10px;background:transparent;-moz-appearance:textfield}
.cnt::-webkit-outer-spin-button,.cnt::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cnt:focus{border-color:var(--line);background:var(--bg)}
.empty{text-align:center;padding:28px 12px}
.empty p{margin:6px 0 16px}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
.btn.primary{background:var(--hab);border-color:var(--hab);color:#fff}
@media (prefers-color-scheme:dark){.btn.primary{color:#062b27}}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.block{display:block;width:100%}
.btn+.btn{margin-top:8px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--hab);color:#fff}
@media (prefers-color-scheme:dark){.seg button[aria-pressed=true]{color:#062b27}}
.controls{display:grid;gap:10px;margin-bottom:12px}
.nav{display:flex;align-items:center;gap:8px}
.nav .lbl{flex:1;text-align:center;font-weight:650}
.stat{font-size:.9rem;color:var(--muted);margin-bottom:6px}
svg.chart{width:100%;height:auto;display:block;touch-action:manipulation}
.chart text{fill:var(--muted);font-size:10px;font-family:inherit}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover,.chart .hit.sel{fill:rgba(128,128,128,.14)}
.cap{min-height:2.6em;font-size:.9rem;margin-top:4px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;border:0;background:none;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.78rem;font-weight:600;color:var(--muted)}
.tabs button[aria-current=page]{color:var(--hab)}
.tabs svg{width:24px;height:24px}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;height:100vh;height:100dvh;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;max-height:88dvh;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet h2{margin-bottom:12px}
label.f{display:block;font-weight:600;margin:12px 0 6px;font-size:.92rem}
input.txt{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--bg)}
.minrow{display:flex;align-items:center;gap:10px}
.minrow output{font-size:1.2rem;font-weight:700;min-width:2ch;text-align:center}
.minrow button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:1.4rem}
.alist .item{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);min-height:48px}
.alist .item:first-child,.ghead+.item{border-top:0}
.alist .item .main{flex:1;min-width:0;text-align:left;display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 0;min-height:48px}
.alist .item .mv{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;flex:none}
.alist .item .mv:disabled{opacity:.3}
.dot{width:10px;height:10px;border-radius:50%;background:var(--hab);flex:none}
.dot.bad{background:var(--bad)}
.warn{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.9rem}
.note{font-size:.88rem;color:var(--muted);margin:8px 0 0}
.hidden{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
textarea.txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);resize:vertical;min-height:110px;font:inherit}
.qlog{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.row.rest .name{color:var(--muted)}
.streak{display:inline-flex;align-items:center;gap:4px;font-size:.82rem;font-weight:600;color:var(--bad)}
.notebtn{display:flex;align-items:center;gap:5px;background:none;border:0;padding:2px 0;min-height:26px;color:var(--muted);font-size:.82rem;max-width:100%;text-align:left}
.notebtn.io{padding:2px 6px;min-height:28px;border-radius:8px}
.notebtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notebtn.has{color:var(--ink)}
.notebtn.has svg{color:var(--g,var(--hab))}
.prog{display:flex;align-items:center;gap:14px}
.prog .t{font-weight:650;font-size:1.05rem}
.prog .s{font-size:.88rem;color:var(--muted)}
.banner{background:var(--bad-soft);color:var(--ink);border-radius:14px;padding:12px;margin-bottom:12px;font-size:.92rem}
.banner .bt{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.hint{font-size:.82rem;color:var(--muted);text-align:center;margin:4px 8px 0}
.gwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px}
table.gt{border-collapse:separate;border-spacing:3px;width:100%}
.gt th{font-weight:600;font-size:.72rem;color:var(--muted);text-align:center;padding:0;line-height:1.15}
.gt th.today{color:var(--hab);text-decoration:underline}
.gt th.rn{text-align:left;position:sticky;left:0;background:var(--card);z-index:1;width:74px;min-width:66px;max-width:84px;font-size:.8rem;color:var(--ink);padding-right:4px;overflow-wrap:break-word;hyphens:auto}
.gt .gr th{text-align:left;font-size:.8rem;color:var(--muted);padding-top:8px}
.gt .gr th span{display:inline-flex;align-items:center;gap:6px;position:sticky;left:0;color:var(--g,var(--muted));font-weight:700}
.gt td{padding:0;text-align:center}
.gt td.sum{font-weight:700;font-size:.85rem;min-width:18px;padding-left:2px}
.cell{width:100%;min-width:25px;height:36px;border-radius:7px;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;font-size:.74rem;font-weight:700;padding:0;position:relative;color:#fff}
.gt.m .cell{min-width:24px;height:32px}
.cell.done{background:var(--g,var(--hab));border-color:var(--g,var(--hab))}
.cell.bad{background:var(--g,var(--bad));border-color:var(--g,var(--bad))}
.cell.part{background:var(--gs,var(--hab-soft));border-color:var(--g,var(--hab));color:var(--g,var(--hab))}
.cell.none{color:transparent}
.cell.rest{border-style:dashed;opacity:.5}
.cell.na{border-color:transparent;background:repeating-linear-gradient(135deg,var(--line) 0 2px,transparent 2px 5px);opacity:.5;pointer-events:none}
.cell.hasnote::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--ink);border:1px solid var(--card)}
.cell.sel{outline:3px solid var(--focus);outline-offset:1px}
@media (prefers-color-scheme:dark){.cell.done{color:var(--gt,#062b27)}.cell.bad{color:var(--gt,#2b1b00)}}
.cell.done,.cell.bad{color:var(--gt,#fff)}
.ghead{display:flex;align-items:center;gap:8px;font-weight:650;font-size:.9rem;color:var(--muted);margin:14px 0 2px}
.ghead .gc{margin-left:auto;font-weight:600;font-size:.82rem}
.ghead svg{flex:none}
.btn.sm{min-height:40px;padding:0 12px;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;gap:6px;font-weight:600}
.chips button[aria-pressed=true]{background:var(--gs,var(--hab-soft));border-color:var(--g,var(--hab));color:var(--g,var(--hab))}
.igrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.igrid button{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:.7rem;font-weight:600;color:var(--muted);padding:4px 2px}
.igrid button[aria-pressed=true]{background:var(--gs,var(--hab-soft));border-color:var(--g,var(--hab));color:var(--g,var(--hab))}
.ghd{display:flex;justify-content:space-between;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.legend button{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:.88rem;font-weight:600;max-width:100%}
.legend button[aria-pressed=false]{opacity:.45;text-decoration:line-through}
.legend svg{flex:none}
.cap ul{margin:0;padding:0;list-style:none;font-size:.88rem}
.cap li{display:flex;align-items:center;gap:6px;padding:1px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#17201e;color:#fff;padding:10px 16px;border-radius:12px;z-index:20;font-size:.92rem;display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:#7ee2d6;font-weight:700;min-height:32px}
.daytools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:2px 0 14px}
.daytools .linkbtn{display:flex;align-items:center;gap:4px}
.daytools .linkbtn.danger{color:var(--danger)}
/* ---- Helse ---- */
.r1{--rb:#b91c1c;--rt:#fff}.r2{--rb:#f0a04b;--rt:#2b1800}.r3{--rb:#d3dbd9;--rt:#17201e}.r4{--rb:#5cc2b5;--rt:#04211d}.r5{--rb:#0f766e;--rt:#fff}
.sv1{--rb:#f7c9a8;--rt:#4a1c06}.sv2{--rb:#ec8a4b;--rt:#2b1200}.sv3{--rb:#b43c0a;--rt:#fff}
.ev1{--rb:#e9defc;--rt:#3b1a8a}.ev2{--rb:#b79cff;--rt:#150b33}.ev3{--rb:#6d28d9;--rt:#fff}
@media (prefers-color-scheme:dark){
.r1{--rb:#f87171;--rt:#2e0808}.r2{--rb:#f59e42;--rt:#2b1800}.r3{--rb:#4a5754;--rt:#e8efed}.r4{--rb:#2dd4bf;--rt:#042f2e}.r5{--rb:#0d9488;--rt:#fff}
.sv1{--rb:#5a3318;--rt:#fde3d3}.sv2{--rb:#c2691f;--rt:#fff}.sv3{--rb:#fb923c;--rt:#2b1200}
.ev1{--rb:#2c2150;--rt:#e9defc}.ev2{--rb:#7c5cd6;--rt:#fff}.ev3{--rb:#b79cff;--rt:#150b33}}
.sc{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px}
.sc.n5{--n:5}.sc.n4{--n:4}.sc.n3{--n:3}
.sc button{min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:2px solid var(--line);border-radius:12px;background:var(--bg);font-size:.68rem;font-weight:600;padding:4px 1px;line-height:1.1;overflow-wrap:anywhere}
.sc button[aria-pressed=true]{background:var(--rb);border-color:var(--rb);color:var(--rt)}
.ctitle{font-size:.8rem;font-weight:700;color:var(--muted);margin:12px 0 4px}
.symrow{margin:8px 0}.symn{font-weight:600;font-size:.92rem;margin-bottom:4px}
.seg.sm button{min-height:36px;font-size:.82rem}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.chipx{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:.82rem;font-weight:600;background:var(--rb);color:var(--rt)}
.chipx.r0{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.chipt{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:.82rem;font-weight:600;background:var(--gs);color:var(--g)}
.evrow{display:flex;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 0;min-height:40px;align-items:center;gap:4px;flex-wrap:wrap}
.evrow .evt{font-weight:600;overflow-wrap:anywhere}
.hrow{display:flex;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;min-height:46px;align-items:center;gap:8px}
.cell.r1,.cell.r2,.cell.r3,.cell.r4,.cell.r5,.cell.sv1,.cell.sv2,.cell.sv3,.cell.ev1,.cell.ev2,.cell.ev3{background:var(--rb);border-color:var(--rb);color:var(--rt)}
.cell.r0{border-style:dashed;color:var(--muted)}
.cell.free{background:var(--hab-soft);border-color:var(--hab-soft);color:var(--hab)}
.cell svg{display:block}

</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs" aria-label="Hovedmeny"></nav>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">
<input type="date" id="datePick" class="hidden" aria-label="Velg dato">
<div id="toast-root"></div>

<script>
(() => {
'use strict';
/* ---------- Hjelpere ---------- */
const DAYN = ['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
const DAYS3 = ['søn','man','tir','ons','tor','fre','lør'];
const MONTHN = ['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
const MON3 = ['jan','feb','mar','apr','mai','jun','jul','aug','sep','okt','nov','des'];
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; };
const todayStr = () => ymd(new Date());
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const cap1 = s => s.charAt(0).toUpperCase() + s.slice(1);
const longDate = s => { const d = parse(s); return `${DAYN[d.getDay()]} ${d.getDate()}. ${MONTHN[d.getMonth()]}`; };

function periodDays() {

  if (state.prefs.range === 'week') {
    const end = addDays(today, ui.offset * 7);
    const start = addDays(end, -6);

    const lbl = (ui.offset === 0 ? 'Siste 7 dager' : `${start.getDate()}. ${MON3[start.getMonth()]} – ${end.getDate()}. ${MON3[end.getMonth()]}`);
    return { days, label: lbl, sub: `${start.getDate()}. ${MON3[start.getMonth()]} – ${end.getDate()}. ${MON3[end.getMonth()]} ${end.getFullYear()}` };
  }
  const base = new Date(today.getFullYear(), today.getMonth() + ui.offset, 1);
  const n = new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
  const days = Array.from({length:n}, (_,i) => ymd(new Date(base.getFullYear(), base.getMonth(), i+1)));
  return { days, label: `${cap1(MONTHN[base.getMonth()])} ${base.getFullYear()}` };
}
function niceAxis(max) {
  const step = max <= 4 ? 1 : Math.ceil(max / 4);
  const top = step * Math.ceil(max / step);
  const ticks = []; for (let v = 0; v <= top; v += step) ticks.push(v);
  return { top, ticks };
}
function chartSVG(id, vals, labels, kind, color, axis, month) {
  const W = 340, H = id.h || 196, L = axis.L || 38, R = 8, T = 10, B = 34;
  const pw = W - L - R, ph = H - T - B, n = vals.length, st = pw / n;
  const y = v => T + ph - (v / axis.top) * ph;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(id.aria)}">`;
  axis.ticks.forEach(t => { s += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-5}" y="${y(t)+3}" text-anchor="end">${axis.fmt ? axis.fmt(t) : t + (axis.pct?' %':'')}</text>`; });
  if (kind === 'bar') {
    vals.forEach((v,i) => {
      if (v == null) return;
      const bw = Math.max(2, st * (month ? .72 : .6)), x = L + i*st + (st-bw)/2;
      const hgt = Math.max(v > 0 ? 2 : 0, ph * v / axis.top);
      if (hgt) s += `<rect x="${x.toFixed(1)}" y="${(T+ph-hgt).toFixed(1)}" width="${bw.toFixed(1)}" height="${hgt.toFixed(1)}" rx="${month?1:3}" fill="${color}"/>`;
    });
  } else {
    let seg = [], paths = [];
    vals.forEach((v,i) => { if (v == null) { if (seg.length) paths.push(seg); seg = []; } else seg.push([L+(i+.5)*st, y(v)]); });
    if (seg.length) paths.push(seg);
    paths.forEach(p => {
      if (p.length > 1) s += `<path d="M${p.map(q => q[0].toFixed(1)+','+q[1].toFixed(1)).join('L')}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
    });
    vals.forEach((v,i) => { if (v != null) s += `<circle cx="${(L+(i+.5)*st).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${month?2.4:4}" fill="${color}"/>`; });
  }
  labels.forEach((lb,i) => {
    const cx = L + (i+.5)*st;
    if (lb[0]) s += `<text x="${cx.toFixed(1)}" y="${H-18}" text-anchor="middle">${lb[0]}</text>`;
    if (lb[1]) s += `<text x="${cx.toFixed(1)}" y="${H-6}" text-anchor="middle">${lb[1]}</text>`;
  });
  vals.forEach((v,i) => { s += `<rect class="hit" data-act="sel" data-chart="${id.k}" data-i="${i}" x="${(L+i*st).toFixed(1)}" y="${T}" width="${st.toFixed(1)}" height="${ph}"><title>${esc(id.tips[i])}</title></rect>`; });
  return s + '</svg>';
}

const SHAPES = [
  (x,y,c) => `<circle cx="${x}" cy="${y}" r="4" fill="${c}"/>`,
  (x,y,c) => `<rect x="${x-3.6}" y="${y-3.6}" width="7.2" height="7.2" fill="${c}"/>`,
  (x,y,c) => `<path d="M${x} ${y-5}L${x+4.6} ${y+3.6}L${x-4.6} ${y+3.6}Z" fill="${c}"/>`,

function multiLineSVG(key, series, labels, axis, month, ariaLabel, tips) {
  const W = 340, H = 200, L = 64, R = 10, T = 16, B = 34;
  const pw = W - L - R, ph = H - T - B, n = labels.length, st = pw / n, k = series.length;
  const y = v => T + ph - (v / axis.top) * ph;
  let o = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ariaLabel)}">`;
  axis.ticks.forEach(t => { o += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-5}" y="${y(t)+3}" text-anchor="end">${axis.fmt(t)}</text>`; });
  series.forEach(se => {
    const off = (se.slot - (k - 1) / 2) * 3;   // liten forskyvning så overlappende linjer er synlige
    let seg = [], paths = [];
    se.vals.forEach((v,i) => { if (v == null) { if (seg.length) paths.push(seg); seg = []; } else seg.push([L+(i+.5)*st, y(v)+off]); });
    if (seg.length) paths.push(seg);
    const col = serColor(se.idx);
    paths.forEach(pt => { if (pt.length > 1) o += `<path d="M${pt.map(q => q[0].toFixed(1)+','+q[1].toFixed(1)).join('L')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>`; });
    se.vals.forEach((v,i) => { if (v != null) o += month ? `<circle cx="${(L+(i+.5)*st).toFixed(1)}" cy="${(y(v)+off).toFixed(1)}" r="2" fill="${col}"/>` : SHAPES[se.idx % 4](+(L+(i+.5)*st).toFixed(1), +(y(v)+off).toFixed(1), col); });
  });
  labels.forEach((lb,i) => {
    const cx = L + (i+.5)*st;
    if (lb[0]) o += `<text x="${cx.toFixed(1)}" y="${H-18}" text-anchor="middle">${lb[0]}</text>`;
    if (lb[1]) o += `<text x="${cx.toFixed(1)}" y="${H-6}" text-anchor="middle">${lb[1]}</text>`;
  });
  for (let i = 0; i < n; i++) o += `<rect class="hit" data-act="sel" data-chart="${key}" data-i="${i}" x="${(L+i*st).toFixed(1)}" y="${T}" width="${st.toFixed(1)}" height="${ph}"><title>${esc(tips[i])}</title></rect>`;
  return o + '</svg>';
}

    <div class="gwrap"><table class="gt ${month ? 'm' : 'w'}"><caption class="sr">${esc(title)}, ${esc(label)}</caption><thead><tr><th class="rn" scope="col"><span class="sr">Rad</span></th>${days.map(head).join('')}<th scope="col" title="${sh[1]}">${sh[0]}</th></tr></thead><tbody>
    ${rows.map(r => `<tr><th class="rn" scope="row">${esc(r.n)}</th>${r.cells.join('')}<td class="sum">${r.sum}</td></tr>`).join('')}</tbody></table></div>
    <div class="cap" id="cap-hc-${sec}" aria-live="polite" style="align-items:flex-start;margin-top:8px"><span class="muted">Trykk på en rute for detaljer.</span></div></section>`;
  let h = '';
  if (!line) {
    const rows = M.map(m => {
      let s = 0, n = 0;
      const cells = days.map(d => {
        if (d > today) return cell('ci', d, 'na', '', shortDate(d));
        const ci = ciOf(d), v = ci && ci[m.k] != null ? ci[m.k] : null;
        if (v == null) return cell('ci', d, 'none', '', `${m.n}, ${shortDate(d)}: ikke registrert`);
        s += v; n++;
        return cell('ci', d, m.cls(v), month ? String(v) : m.ic(v), `${m.n}, ${shortDate(d)}: ${m.lab(v)}`);
      });
      return { n: m.n, cells, sum: fmtAvg(n ? s / n : null) };
    });
    h += tbl('ci', 'Innsjekk', `${have.length} dag${have.length === 1 ? '' : 'er'}`, 'Farge og tegn viser nivå: rød/oransje = lavt, grått = midt, grønt = høyt. Σ = snitt.', rows, ['Σ', 'Snitt']);
    if (H.symptoms.length) {
      const srows = H.symptoms.map(sy => {
        let n = 0;
        const cells = days.map(d => {
          if (d > today) return cell('sy', d, 'na', '', shortDate(d));
          const ci = ciOf(d); if (!ci) return cell('sy', d, 'none', '', `${sy.name}, ${shortDate(d)}: ikke registrert`);
          const v = ci.sym && ci.sym[sy.id];
          if (v) { n++; return cell('sy', d, 'sv' + v, String(v), `${sy.name}, ${shortDate(d)}: ${SYMSEV[v].toLowerCase()}`); }
          return cell('sy', d, 'free', month ? '' : I.check, `${sy.name}, ${shortDate(d)}: ingen`);
        });
        return { n: sy.name, cells, sum: n };
      });
      h += tbl('sy', 'Symptomer', '', 'Tall = styrke (1 lett, 2 middels, 3 sterk). Hake = innsjekk uten symptomet. Σ = dager med symptomet.', srows, ['Σ', 'Dager med symptom']);
    }
    h += forgetCard('grid', days, label, month, labels, today);
  } else {
    const norm = (m, v) => m.k === 'focus' ? (v - 1) * 2 : m.k === 'energy' ? (v - 1) * 4 / 3 : v - 1;
    const all = M.map((m, i) => ({ id: 'hm_' + m.k, n: m.n, idx: i, vals: days.map(d => { const ci = ciOf(d); return ci && ci[m.k] != null ? norm(m, ci[m.k]) : null; }) }));
    const vis = all.filter(x => !ui.hide[x.id]).map((x, slot) => Object.assign({}, x, { slot }));
    const tips = days.map(d => { const ci = ciOf(d); return cap1(shortDate(d)) + ': ' + (ci ? M.filter(m => ci[m.k] != null).map(m => m.n + ' ' + m.lab(ci[m.k]).toLowerCase()).join('; ') || 'ingen verdier' : d > today ? 'fremtiden' : 'ingen innsjekk'); });
    chartTips.hl = { days, tips, rows: days.map(hDayHtml) };
    h += `<section class="card"><h2>Innsjekk <span class="badge">${have.length} dag${have.length === 1 ? '' : 'er'}</span></h2><p class="stat">Lav til høy. Trykk på navnene for å skjule/vise linjer.</p>`
      + (vis.length ? multiLineSVG('hl', vis, labels, { top:4, ticks:[0,2,4], fmt: t => ({ 0:'Lav', 2:'Middels', 4:'Høy' })[t] }, month, `Innsjekk, ${label}`, tips) : `<p class="muted">Alle linjer er skjult.</p>`)
      + `<div class="legend">${all.map(x => `<button data-act="legend" data-id="${x.id}" aria-pressed="${!ui.hide[x.id]}">${legendMark(x.idx)}${esc(x.n)}</button>`).join('')}</div>`
      + `<div class="cap" id="cap-hl" aria-live="polite" style="align-items:flex-start;margin-top:10px"><span class="muted">Trykk på en dag for detaljer.</span></div></section>`;
    if (H.symptoms.length) {
      const sall = H.symptoms.map((sy, i) => ({ id: 'hs_' + sy.id, n: sy.name, idx: i, vals: days.map(d => { const ci = ciOf(d); return ci ? ((ci.sym && ci.sym[sy.id]) || 0) : null; }) }));
      const svis = sall.filter(x => !ui.hide[x.id]).map((x, slot) => Object.assign({}, x, { slot }));
      const stips = days.map(d => { const ci = ciOf(d); return cap1(shortDate(d)) + ': ' + (ci ? H.symptoms.map(sy => sy.name + ' ' + SYMSEV[(ci.sym && ci.sym[sy.id]) || 0].toLowerCase()).join('; ') : d > today ? 'fremtiden' : 'ingen innsjekk'); });
      chartTips.hs = { days, tips: stips, rows: days.map(hDayHtml) };
      h += `<section class="card"><h2>Symptomer</h2><p class="stat">Styrke per dag. Trykk på navnene for å skjule/vise linjer.</p>`
        + (svis.length ? multiLineSVG('hs', svis, labels, { top:3, ticks:[0,1,2,3], fmt: t => SYMSEV[t] }, month, `Symptomer, ${label}`, stips) : `<p class="muted">Alle linjer er skjult.</p>`)
        + `<div class="legend">${sall.map(x => `<button data-act="legend" data-id="${x.id}" aria-pressed="${!ui.hide[x.id]}">${legendMark(x.idx)}${esc(x.n)}</button>`).join('')}</div>`
        + `<div class="cap" id="cap-hs" aria-live="polite" style="align-items:flex-start;margin-top:10px"><span class="muted">Trykk på en dag for detaljer.</span></div></section>`;
    }
    h += forgetCard('bar', days, label, month, labels, today);
  }
  const cnt = {}; have.forEach(d => (getCI(d).tags || []).forEach(t => { cnt[t] = (cnt[t] || 0) + 1; }));
  const tagsUsed = Object.keys(cnt);
  if (tagsUsed.length) {
    h += `<section class="card"><h2>Humørtagger</h2><p class="stat">Hvor mange dager hver tagg er brukt i perioden.</p>`;
    Object.keys(CLUSTERS).forEach(k => {
      const ts = H.tags.filter(t => t.cl === k && cnt[t.id]).sort((a, b) => cnt[b.id] - cnt[a.id]);
      if (ts.length) h += `<div class="ctitle">${CLUSTERS[k].n}</div><div class="chiprow gc-${CLUSTERS[k].c}">${ts.map(t => `<span class="chipt">${esc(t.name)} ×${cnt[t.id]}</span>`).join('')}</div>`;
    });
    h += `</section>`;
  }
  return h;
}

function renderTrends() {
  const { days, label, sub } = periodDays();
  const month = state.prefs.range === 'month', kind = state.prefs.kind, today = todayStr();
  const labels = days.map((d,i) => {
    const dt = parse(d), dn = dt.getDate();
    if (!month) return [DAYS3[dt.getDay()], String(dn)];
    return [null, (dn === 1 || dn % 5 === 0) ? String(dn) : null];
  });
  const hv = [], hTips = [], bv = [], bTips = [];
  days.forEach(d => {
    const fut = d > today, hd = fut ? null : habitDay(d), bd = fut ? null : badDay(d);
    hv.push(hd ? hd.pct : null);
    hTips.push(`${cap1(shortDate(d))}: ` + (fut ? 'fremtiden' : hd ? `${hd.reached} av ${hd.total} vaner nådd (${hd.pct} %)` : 'ingen vaner å spore'));
    bv.push(bd ? bd.n : null);
    bTips.push(`${cap1(shortDate(d))}: ` + (fut ? 'fremtiden' : bd ? `${bd.n} uvane${bd.n===1?'':'r'} registrert` : 'ingen uvaner å spore'));
  });
  chartTips = { h: { days, tips: hTips }, b: { days, tips: bTips } };
  const hnum = hv.filter(v => v != null), bnum = bv.filter(v => v != null);
  const havg = hnum.length ? Math.round(hnum.reduce((a,b)=>a+b,0)/hnum.length) : null;
  const btot = bnum.reduce((a,b)=>a+b,0);
  const bmax = Math.max(1, ...bnum);
  const canNext = ui.offset < 0;
  const isHealth = showHealth() && state.prefs.tsec === 'health';
  const secSeg = showHealth() ? `<div class="seg" role="group" aria-label="Område"><button data-act="tsec" data-s="habits" aria-pressed="${!isHealth}">Vaner og uvaner</button><button data-act="tsec" data-s="health" aria-pressed="${isHealth}">Helse</button></div>` : '';
  const kindSeg = isHealth ? `<div class="seg" role="group" aria-label="Visning"><button data-act="hkind" data-k="grid" aria-pressed="${state.prefs.hkind !== 'line'}">Ruter</button><button data-act="hkind" data-k="line" aria-pressed="${state.prefs.hkind === 'line'}">Linje</button></div>` : `<div class="seg" role="group" aria-label="Diagramtype">
      <button data-act="kind" data-k="bar" aria-pressed="${kind==='bar'}">Stolper</button>
      <button data-act="kind" data-k="line" aria-pressed="${kind==='line'}">Linje</button>
      <button data-act="kind" data-k="grid" aria-pressed="${kind==='grid'}">Ruter</button></div>`;
  let h = `<div class="top"><h1>Trender</h1></div><div class="controls">${secSeg}
    <div class="seg" role="group" aria-label="Periode">
      <button data-act="range" data-r="week" aria-pressed="${!month}">7 dager</button>
      <button data-act="range" data-r="month" aria-pressed="${month}">Måned</button></div>
    <div class="nav"><button class="iconbtn" data-act="off" data-d="-1" aria-label="${month?'Forrige måned':'Forrige uke'}">${I.left}</button>
      <div class="lbl">${esc(label)}${sub && ui.offset===0 ? `<div class="muted" style="font-weight:400;font-size:.8rem">${esc(sub)}</div>` : ''}</div>
      <button class="iconbtn" data-act="off" data-d="1" aria-label="${month?'Neste måned':'Neste uke'}" ${canNext?'':'disabled'}>${I.right}</button></div>
    ${kindSeg}</div>`;
  if (isHealth) return h + healthTrends(days, label, month, labels, today);

  if (kind === 'grid') {
    const cellOf = (a, d) => {
      if (d > today) return { st: 'na' };
      const c = getCount(a.id, d);
      if (!activeOn(a, d) && !c) return { st: 'na' };
      if (a.type === 'bad') return { st: c > 0 ? 'bad' : 'none', c };
      if (c >= a.target) return { st: 'done', c, v: Math.floor(c / a.target) };
      if (c > 0) return { st: 'part', c };
      return { st: (sched(a).mode === 'days' && !isDue(a, d)) ? 'rest' : 'none', c };
    };
    const mk = (title, type, bad) => {
      const list = orderedAll(type).filter(a => days.some(d => cellOf(a, d).st !== 'na'));
      h += `<section class="card"><h2>${title} <span class="badge ${bad?'bad':''}">${list.length} aktivitet${list.length===1?'':'er'}</span></h2>`;
      if (!list.length) { h += `<p class="muted" style="margin:0">Ingen lagt til ennå.</p></section>`; return; }
      h += `<p class="stat">${bad ? 'Fylt rute = gjort (tall = antall ganger).' : 'Fylt = oppnådd (tall ×2, ×3 …), lys = delvis, tom = ikke gjort, stiplet = hviledag, skravert = ikke i bruk.'} Trykk på en rute for detaljer.${month ? ' Sveip sideveis for hele måneden.' : ''}</p>`;
      h += `<div class="gwrap"><table class="gt ${month ? 'm' : 'w'}"><caption class="sr">${title}, ${esc(label)}</caption><thead><tr><th class="rn" scope="col"><span class="sr">Aktivitet</span></th>`
        + days.map(d => { const dt = parse(d); return `<th scope="col" class="${d === today ? 'today' : ''}">${month ? '' : DAYS3[dt.getDay()] + '<br>'}${dt.getDate()}</th>`; }).join('')
        + `<th scope="col" title="${bad ? 'Antall ganger' : 'Dager oppnådd'}">${bad ? 'Σ' : '✓'}</th></tr></thead><tbody>`;
      grouped(list).forEach(({ g, items }) => {
        if (state.groups.length) h += `<tr class="gr ${g ? 'gc-' + (g.color || 'teal') : ''}"><th colspan="${days.length + 2}" scope="colgroup"><span>${g ? gicon(g.icon, 16) : ''}${g ? esc(g.name) : 'Andre'}</span></th></tr>`;
        items.forEach(a => {
          let sum = 0;
          const cells = days.map(d => {
            const ci = cellOf(a, d); if (a.type === 'bad') sum += ci.c || 0; else if (ci.st === 'done') sum++;
            let inner = '';
            if (ci.st === 'done') inner = ci.v >= 2 ? ci.v : (month ? '' : I.check);
            else if (ci.st === 'bad') inner = ci.c > 1 ? ci.c : (month ? '' : '•');
            else if (ci.st === 'part') inner = month ? '' : ci.c;
            return `<td><button class="cell ${ci.st} ${noteOf(a.id, d) ? 'hasnote' : ''}" data-act="gcell" data-id="${a.id}" data-d="${d}" aria-label="${esc(a.name)}, ${esc(shortDate(d))}: ${esc(statusText(a, d))}${noteOf(a.id, d) ? ', har notat' : ''}" ${ci.st === 'na' ? 'tabindex="-1" aria-disabled="true"' : ''}>${inner}</button></td>`;
          }).join('');
          h += `<tr class="${g ? 'gc-' + (g.color || 'teal') : ''}"><th class="rn" scope="row">${esc(a.name)}${a.archived ? ' <span class="muted">(arkivert)</span>' : ''}</th>${cells}<td class="sum">${sum}</td></tr>`;
        });
      });
      h += `</tbody></table></div><div class="cap" id="cap-g-${type}" aria-live="polite" style="margin-top:8px"><span class="muted">Trykk på en rute for detaljer.</span></div></section>`;
    };
    mk('Vaner', 'habit', false);
    mk('Uvaner', 'bad', true);
    if (showHealth() && state.health.events.length) h += forgetCard('grid', days, label, month, labels, today);
    return h;
  }
  if (kind === 'line') {
    const lvl = (a, d) => {
      if (d > today || (!activeOn(a, d) && !getCount(a.id, d)) || (sched(a).mode === 'days' && !isDue(a, d) && !getCount(a.id, d))) return null;
      const c = getCount(a.id, d);
      return a.type === 'habit' ? (c >= a.target ? Math.floor(c / a.target) : 0) : (c > 0 ? 1 : 0);
    };
    const group = (title, full, bad) => {
      const list = full.filter(a => days.some(d => lvl(a, d) != null));
      h += `<section class="card"><h2>${title} <span class="badge ${bad?'bad':''}">${list.length} aktivitet${list.length===1?'':'er'}</span></h2>`;
      if (!list.length) { h += `<p class="muted" style="margin:0">Ingen lagt til ennå.</p></section>`; return; }
      h += `<p class="stat">${bad ? 'Gjort eller ikke gjort, per dag.' : 'Ikke gjort, oppnådd eller mål ×2, ×3 …, per dag.'} Trykk på navnene for å skjule/vise linjer.</p>`;
      const all = list.map((a, i) => ({ a, idx: i, vals: days.map(d => lvl(a, d)) }));
      const vis = all.filter(x => !ui.hide[x.a.id]).map((x, slot) => Object.assign(x, { slot }));
      const mx = Math.max(1, ...vis.flatMap(x => x.vals.filter(v => v != null)));
      let axis;
      if (bad) axis = { top:1, ticks:[0,1], fmt: t => t ? 'Gjort' : 'Ikke gjort' };
      else {
        let top = mx, stp = 1; if (mx > 5) { stp = Math.ceil(mx/5); top = stp*Math.ceil(mx/stp); }
        const ticks = []; for (let t = 0; t <= top; t += stp) ticks.push(t);
        axis = { top, ticks, fmt: t => t === 0 ? 'Ikke gjort' : t === 1 ? 'Oppnådd' : '×' + t };
      }
      const key = bad ? 'lb' : 'lh';
      const tips = [], rows = [];
      days.forEach((d, i) => {
        const head = cap1(shortDate(d));
        const items = all.filter(x => !ui.hide[x.a.id]).map(x => {
          const c = getCount(x.a.id, d), v = x.vals[i];
          let t;
          if (v == null) t = d > today ? 'fremtiden' : 'ikke i bruk ennå';
          else if (bad) t = c ? `gjort (${c} ${c===1?'gang':'ganger'})` : 'ikke gjort';
          else if (!c) t = 'ikke gjort';
          else if (c < x.a.target) t = `${c} av ${x.a.target}, ikke nådd`;
          else t = (v === 1 ? 'oppnådd' : `mål ×${v}`) + ` (${c} ${c===1?'gang':'ganger'})`;
          return [x, t];
        });
        tips.push(head + ': ' + items.map(([x,t]) => x.a.name + ' ' + t).join('; '));
        rows.push(`<div><b>${esc(head)}</b><ul>` + items.map(([x,t]) => `<li>${legendMark(x.idx)}<span>${esc(x.a.name)}: ${esc(t)}${noteOf(x.a.id, d) ? ` <em>– «${esc(noteOf(x.a.id, d))}»</em>` : ''}</span></li>`).join('') + `</ul></div>` +
          (d <= today ? `<button class="linkbtn" data-act="editday" data-day="${d}">${I.edit} Rediger dag</button>` : ''));
      });
      chartTips[key] = { days, tips, rows };
      h += vis.length ? multiLineSVG(key, vis, labels, axis, month, `${title}, ${label}`, tips)
                      : `<p class="muted">Alle linjer er skjult.</p>`;
      h += `<div class="legend">` + all.map(x => `<button data-act="legend" data-id="${x.a.id}" aria-pressed="${!ui.hide[x.a.id]}">${legendMark(x.idx)}${esc(x.a.name)}${x.a.archived ? ' (arkivert)' : ''}</button>`).join('') + `</div>`;
      h += `<div class="cap" id="cap-${key}" aria-live="polite" style="align-items:flex-start;margin-top:10px"><span class="muted">Trykk på en dag for detaljer.</span></div></section>`;
    };
    group('Vaner', orderedAll('habit'), false);
    group('Uvaner', orderedAll('bad'), true);
    if (showHealth() && state.health.events.length) h += forgetCard('bar', days, label, month, labels, today);
    return h;
  }
  h += `<section class="card"><h2>Vaner <span class="badge">${havg==null?'–':'snitt '+havg+' %'}</span></h2>
    <div class="stat">Andel vaner der minstekravet ble nådd, per dag.</div>`;
  if (!state.activities.some(a => a.type === 'habit')) h += `<p class="muted">Ingen vaner lagt til ennå.</p>`;
  else h += chartSVG({k:'h', tips:hTips, aria:`Vaner, ${label}. ${havg==null?'Ingen data':'Snitt '+havg+' prosent nådd'}`}, hv, labels, kind, 'var(--hab)', {top:100, ticks:[0,50,100], pct:true}, month)
    + `<div class="cap" id="cap-h" aria-live="polite"><span class="muted">Trykk på en dag for detaljer.</span></div>`;
  h += `</section><section class="card"><h2>Uvaner <span class="badge bad">${btot} totalt</span></h2>
    <div class="stat">Antall ganger registrert per dag.</div>`;
  if (!state.activities.some(a => a.type === 'bad')) h += `<p class="muted">Ingen uvaner lagt til ennå.</p>`;
  else h += chartSVG({k:'b', tips:bTips, aria:`Uvaner, ${label}. ${btot} registrert totalt`}, bv, labels, kind, 'var(--bad)', Object.assign(niceAxis(bmax), {pct:false}), month)
    + `<div class="cap" id="cap-b" aria-live="polite"><span class="muted">Trykk på en dag for detaljer.</span></div>`;
  h += `</section>`;
  if (showHealth() && state.health.events.length) h += forgetCard('bar', days, label, month, labels, today);
  return h;
}

/* --- Aktiviteter --- */
function schedText(a) {
  const s = sched(a);
  if (s.mode === 'days') return ' · ' + [1,2,3,4,5,6,0].filter(d => (s.days || []).includes(d)).map(d => DAYS3[d]).join(', ');
  if (s.mode === 'week') return ' · ' + s.n + ' dager/uke';
  return '';
}
function renderActs() {
  const arrow = d => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="${d<0?'M6 15l6-6 6 6':'M6 9l6 6 6-6'}"/></svg>`;
  const item = (a, i, list) => `<div class="item"><button class="main" data-act="edit" data-id="${a.id}" aria-label="Rediger ${esc(a.name)}"><span class="dot ${a.type==='bad'?'bad':''}"></span>
    <span style="flex:1;overflow-wrap:anywhere"><b>${esc(a.name)}</b> ${a.type==='habit' ? `<span class="muted"> · minst ${a.target}×/dag${schedText(a)}</span>` : ''}</span></button>
    <button class="mv" data-act="move" data-id="${a.id}" data-d="-1" aria-label="Flytt opp: ${esc(a.name)}" ${i===0?'disabled':''}>${arrow(-1)}</button>
    <button class="mv" data-act="move" data-id="${a.id}" data-d="1" aria-label="Flytt ned: ${esc(a.name)}" ${i===list.length-1?'disabled':''}>${arrow(1)}</button></div>`;
  const sect = (type, none) => {
    const list = live(type);
    if (!list.length) return `<section class="card"><p class="muted" style="margin:0">${none}</p></section>`;
    return grouped(list).map(({ g, items }) => {
      const head = state.groups.length ? `<div class="gh">${g ? `<span class="ic">${gicon(g.icon, 20)}</span>` : ''}<span class="nm">${g ? esc(g.name) : 'Andre'}</span></div>` : '';
      return `<section class="card ${g ? 'gcard gc-' + (g.color || 'teal') : ''}" aria-label="${g ? esc(g.name) : 'Andre'}">${head}<div class="alist">${items.map((a, i) => item(a, i, items)).join('')}</div></section>`;
    }).join('');
  };
  let h = `<div class="top"><h1>Aktiviteter</h1><button class="btn primary" data-act="newact">+ Ny</button></div>`;
  if (!storageOK) h += `<div class="warn" role="alert">Nettleseren tillater ikke lagring. Data blir borte når du lukker appen.</div>`;
  h += `<div class="sect"><h2>Vaner</h2></div>${sect('habit', 'Ingen vaner.')}`;
  h += `<div class="sect"><h2>Uvaner</h2></div>${sect('bad', 'Ingen uvaner.')}`;
  h += `<section class="card"><div class="ghd"><h2 style="margin:0">Grupper</h2><button class="btn sm" data-act="gnew">+ Ny gruppe</button></div>`;
  if (!state.groups.length) h += `<p class="note">Samle aktiviteter i grupper, for eksempel «Mosjon» eller «Hjemme», og velg et ikon til hver gruppe.</p>`;
  else h += `<div class="alist" style="margin-top:6px">` + state.groups.map((g, i) => {
    const n = state.activities.filter(a => a.group === g.id && !a.archived).length;

/* ---------- Toast (angre) ---------- */
let toastTimer;
function toast(msg, undo) {
  const r = document.getElementById('toast-root');
  r.innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${undo ? '<button data-act="undo">Angre</button>' : ''}</div>`;
  toast.undo = undo;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { r.innerHTML = ''; toast.undo = null; }, 6000);
}

function openEdit(id) {
  const a = id && state.activities.find(x => x.id === id);
  ui.edit = a ? { id:a.id, name:a.name, type:a.type, target:a.target, group:a.group || null, archived:!!a.archived, sched:JSON.parse(JSON.stringify(Object.assign({ mode:'daily', days:[1,2,3,4,5], n:3 }, a.sched || {}))), focus:false }
              : { id:null, name:'', type:'habit', target:1, group:null, archived:false, sched:{ mode:'daily', days:[1,2,3,4,5], n:3 }, focus:false };
  render();
}
async function doExport() {
  const text = JSON.stringify(state, null, 1), name = `vanelogg-${todayStr()}.json`;
  let done = false;
  try {
    const f = new File([text], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'Vanelogg sikkerhetskopi' }); done = true; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  if (!done) download(name, text);
  state.meta.lastBackup = todayStr(); state.meta.snoozeUntil = null; save(); render();
  toast('Sikkerhetskopi lagret');
}
function download(name, text) {
  const b = new Blob([text], { type:'application/json' }), u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 2000);
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (ui.ci) syncCN();
  switch (act) {
    case 'tsec': state.prefs.tsec = el.dataset.s; save(); render(); break;
    case 'hkind': state.prefs.hkind = el.dataset.k; save(); render(); break;
    case 'hcell': {
      const d = el.dataset.d; document.querySelectorAll('.cell.sel').forEach(r => r.classList.remove('sel')); el.classList.add('sel');
      const cap = document.getElementById('cap-hc-' + el.dataset.sec); if (cap) cap.innerHTML = hDayHtml(d); break; }
    case 'ci': ui.ci = ui.day; render(); break;

/* Skriv tall direkte */
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.classList.contains('cnt')) { setCount(el.dataset.id, ui.day, el.value); render(); }
  else if (el.id === 'c-note') syncCN();
  else if (el.id === 'rtime') { state.meta.remindTime = el.value || '20:00'; save(); }
  else if (el.id === 'datePick') { if (el.value && el.value <= todayStr()) { ui.day = el.value; render(); } el.classList.add('hidden'); }
  else if (el.id === 'importFile' && el.files[0]) {
    const f = el.files[0], r = new FileReader();
    r.onload = () => {
      try {
        const p = JSON.parse(r.result);
        if (!p || !Array.isArray(p.activities) || typeof p.logs !== 'object') throw 0;
        if (!confirm('Dette erstatter all eksisterende data i appen. Fortsette?')) return;
        state = { v:1, activities:p.activities, groups:Array.isArray(p.groups) ? p.groups.map((g, i) => Object.assign({ color: COLORS[i % COLORS.length].k }, g)) : [], notes:(p.notes && typeof p.notes === 'object') ? p.notes : {}, meta:Object.assign({ lastBackup:null, snoozeUntil:null, remindTime:'20:00' }, p.meta || {}), logs:p.logs, health: normHealth(p.health), prefs:Object.assign({range:'week',kind:'bar'}, p.prefs||{}) };
        save(); ui.offset = 0; render(); toast('Sikkerhetskopi gjenopprettet');
      } catch(e) { alert('Filen ser ikke ut som en gyldig sikkerhetskopi fra Vanelogg.'); }
    };
    r.readAsText(f); el.value = '';
  }
});
document.addEventListener('keydown', ev => {

    else if (ui.edit || ui.gedit || ui.note) { ui.edit = null; ui.gedit = null; ui.note = null; } else return;
    render();
  }
  if (ev.key === 'Enter' && ev.target.id === 'e-text') { ev.preventDefault(); document.querySelector('[data-act="evsave"]').click(); }
  if (ev.key === 'Enter' && ev.target.id === 'h-name') { ev.preventDefault(); document.querySelector('[data-act="hsave"]').click(); }
